services:
  - type: web
    name: iris-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/iris_model.joblib
