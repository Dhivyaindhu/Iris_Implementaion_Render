name: Live smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # every day, 07:00 India time

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test the live API
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "Set a repository variable named LIVE_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          python smoke_test.py "$LIVE_URL" --attempts 12 --delay 15
